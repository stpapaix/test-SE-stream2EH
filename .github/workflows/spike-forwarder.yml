name: Voltage Spike Forwarder

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'How long to consume/forward events for (seconds)'
        default: '300'

permissions:
  contents: read

jobs:
  forward:
    runs-on: ubuntu-latest
    env:
      SOURCE_CONSUMER_GROUP: "$Default"
      DURATION_SECONDS: ${{ github.event.inputs.duration_seconds || '300' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -q -r forwarder/requirements.txt

      - name: Forward voltage spike events to EH-target
        env:
          SOURCE_CONNECTION_STRING: ${{ secrets.FABRIC_ENDPOINT_CONNECTION_STRING }}
          TARGET_CONNECTION_STRING: ${{ secrets.EHTARGET_SEND_CONNECTION_STRING }}
        run: python forwarder/forwarder.py
