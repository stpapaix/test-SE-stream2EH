name: Fabric Eventstream Auto-Wire (Discovery)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  discover-connection-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get Fabric-scoped access token
        run: |
          FABRIC_TOKEN=$(az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv)
          echo "::add-mask::$FABRIC_TOKEN"
          echo "FABRIC_TOKEN=$FABRIC_TOKEN" >> "$GITHUB_ENV"

      - name: List supported connection types (find Azure Event Hub schema)
        run: |
          curl -sf -H "Authorization: Bearer $FABRIC_TOKEN" \
            "https://api.fabric.microsoft.com/v1/connections/supportedConnectionTypes?showAllCreationMethods=true" \
            | jq '.value[] | select(.type | test("EventHub"; "i"))'

      - name: Resolve db4ehab KQL database item ID
        run: |
          curl -sf -H "Authorization: Bearer $FABRIC_TOKEN" \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ vars.FABRIC_WORKSPACE_ID }}/items" \
            | jq '.value[] | select(.displayName=="db4ehab")'
