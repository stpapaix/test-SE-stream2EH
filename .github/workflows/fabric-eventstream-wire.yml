name: Fabric Eventstream Auto-Wire

on:
  workflow_dispatch:
    inputs:
      force_deprovision:
        description: "Deprovision the (failed) workspace identity and exit. Use this after waiting 1 hour following a 'Failed to create workspace identity' error, per Microsoft's documented remediation."
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  wire-eventstream:
    runs-on: ubuntu-latest
    env:
      NAMESPACE_NAME: ehns-test-se-stream2eh-srzfa5vvnklsy
      RESOURCE_GROUP: test-SE-stream2EH
      EVENTHUB_NAME: EH-source
      SAS_POLICY_NAME: fabric-listen-policy
      TABLE_NAME: EnergyTelemetry
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get Fabric-scoped access token
        run: |
          FABRIC_TOKEN=$(az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv)
          echo "::add-mask::$FABRIC_TOKEN"
          echo "FABRIC_TOKEN=$FABRIC_TOKEN" >> "$GITHUB_ENV"

      - name: Deprovision workspace identity (cleanup after a Failed state)
        if: ${{ inputs.force_deprovision == true }}
        run: |
          HTTP_STATUS=$(curl -s -D deprovision-headers.txt -o deprovision-response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $FABRIC_TOKEN" \
            -H "Content-Length: 0" \
            --data-raw "" \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ vars.FABRIC_WORKSPACE_ID }}/deprovisionIdentity")
          echo "HTTP status: $HTTP_STATUS"
          cat deprovision-response.json | jq . || cat deprovision-response.json
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::deprovisionIdentity failed with status $HTTP_STATUS"
            exit 1
          fi
          if [ "$HTTP_STATUS" = "202" ]; then
            OP_URL=$(grep -i '^location:' deprovision-headers.txt | sed 's/^[Ll]ocation: //I' | tr -d '\r')
            echo "Polling LRO: $OP_URL"
            for i in $(seq 1 15); do
              sleep 3
              OP_STATUS_JSON=$(curl -s -H "Authorization: Bearer $FABRIC_TOKEN" "$OP_URL")
              OP_STATE=$(echo "$OP_STATUS_JSON" | jq -r '.status')
              echo "Operation status: $OP_STATE"
              if [ "$OP_STATE" = "Succeeded" ]; then
                echo "Deprovision succeeded."
                break
              elif [ "$OP_STATE" = "Failed" ]; then
                echo "::error::deprovisionIdentity operation failed"
                echo "$OP_STATUS_JSON" | jq .
                exit 1
              fi
            done
          fi
          echo "::notice::Workspace identity deprovisioned. Wait 5 minutes, then re-run this workflow WITHOUT force_deprovision to create it again."

      - name: Provision (or reuse) the Fabric workspace identity
        if: ${{ inputs.force_deprovision != true }}
        run: |
          WS=$(curl -sf -H "Authorization: Bearer $FABRIC_TOKEN" \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ vars.FABRIC_WORKSPACE_ID }}")
          WS_SP_ID=$(echo "$WS" | jq -r '.workspaceIdentity.servicePrincipalId // empty')
          if [ -n "$WS_SP_ID" ]; then
            echo "Workspace identity already provisioned: $WS_SP_ID"
          else
            HTTP_STATUS=$(curl -s -D provision-headers.txt -o provision-response.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $FABRIC_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Content-Length: 0" \
              --data-raw "" \
              "https://api.fabric.microsoft.com/v1/workspaces/${{ vars.FABRIC_WORKSPACE_ID }}/provisionIdentity")
            echo "HTTP status: $HTTP_STATUS"
            cat provision-response.json | jq . || cat provision-response.json
            if [ "$HTTP_STATUS" -ge 400 ]; then
              echo "::error::provisionIdentity failed with status $HTTP_STATUS"
              exit 1
            fi
            if [ "$HTTP_STATUS" = "202" ]; then
              # Long-running operation: poll the operation URL until it succeeds
              OP_URL=$(grep -i '^location:' provision-headers.txt | sed 's/^[Ll]ocation: //I' | tr -d '\r')
              echo "Polling LRO: $OP_URL"
              for i in $(seq 1 15); do
                sleep 3
                OP_STATUS_JSON=$(curl -s -H "Authorization: Bearer $FABRIC_TOKEN" "$OP_URL")
                OP_STATE=$(echo "$OP_STATUS_JSON" | jq -r '.status')
                echo "Operation status: $OP_STATE"
                if [ "$OP_STATE" = "Succeeded" ]; then
                  curl -s -H "Authorization: Bearer $FABRIC_TOKEN" "$OP_URL/result" -o provision-response.json
                  cat provision-response.json | jq . || cat provision-response.json
                  break
                elif [ "$OP_STATE" = "Failed" ]; then
                  echo "::error::provisionIdentity operation failed"
                  echo "$OP_STATUS_JSON" | jq .
                  exit 1
                fi
              done
            fi
            WS_SP_ID=$(jq -r '.servicePrincipalId' provision-response.json)
          fi
          echo "WS_SP_ID=$WS_SP_ID" >> "$GITHUB_ENV"
          echo "::notice::Workspace identity servicePrincipalId=$WS_SP_ID (needs Azure Event Hubs Data Receiver role on the namespace)"

      - name: Resolve Eventstream and KQL Database item IDs
        if: ${{ inputs.force_deprovision != true }}
        run: |
          ITEMS=$(curl -sf -H "Authorization: Bearer $FABRIC_TOKEN" \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ vars.FABRIC_WORKSPACE_ID }}/items")
          EVENTSTREAM_ID=$(echo "$ITEMS" | jq -r '.value[] | select(.type=="Eventstream" and .displayName=="stream4ehab") | .id')
          KQLDB_ID=$(echo "$ITEMS" | jq -r '.value[] | select(.type=="KQLDatabase" and .displayName=="db4ehab") | .id')
          echo "EVENTSTREAM_ID=$EVENTSTREAM_ID" >> "$GITHUB_ENV"
          echo "KQLDB_ID=$KQLDB_ID" >> "$GITHUB_ENV"
          echo "Eventstream ID: $EVENTSTREAM_ID"
          echo "KQL Database ID: $KQLDB_ID"

      - name: Create Fabric connection to EH-source (idempotent)
        if: ${{ inputs.force_deprovision != true }}
        run: |
          EXISTING=$(curl -sf -H "Authorization: Bearer $FABRIC_TOKEN" \
            "https://api.fabric.microsoft.com/v1/connections" \
            | jq -r '.value[] | select(.displayName=="eh-source-connection") | .id')
          if [ -n "$EXISTING" ]; then
            echo "Connection already exists: $EXISTING"
            echo "CONNECTION_ID=$EXISTING" >> "$GITHUB_ENV"
          else
            cat > connection-request.json <<EOF
          {
            "connectivityType": "ShareableCloud",
            "displayName": "eh-source-connection",
            "privacyLevel": "Organizational",
            "connectionDetails": {
              "type": "EventHub",
              "creationMethod": "EventHub.Contents",
              "parameters": [
                { "dataType": "Text", "name": "endpoint", "value": "sb://${NAMESPACE_NAME}.servicebus.windows.net/" },
                { "dataType": "Text", "name": "entityPath", "value": "${EVENTHUB_NAME}" }
              ]
            },
            "credentialDetails": {
              "singleSignOnType": "None",
              "connectionEncryption": "NotEncrypted",
              "skipTestConnection": false,
              "credentials": {
                "credentialType": "WorkspaceIdentity"
              }
            }
          }
          EOF
            HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $FABRIC_TOKEN" -H "Content-Type: application/json" \
              "https://api.fabric.microsoft.com/v1/connections" \
              -d @connection-request.json)
            echo "HTTP status: $HTTP_STATUS"
            cat response.json | jq . || cat response.json
            if [ "$HTTP_STATUS" -ge 400 ]; then
              echo "::error::Connection creation failed with status $HTTP_STATUS"
              exit 1
            fi
            CONNECTION_ID=$(jq -r '.id' response.json)
            echo "CONNECTION_ID=$CONNECTION_ID" >> "$GITHUB_ENV"
          fi

      - name: Build and apply Eventstream topology definition
        if: ${{ inputs.force_deprovision != true }}
        run: |
          cat > eventstream.json <<EOF
          {
            "sources": [
              {
                "name": "EH-source",
                "type": "AzureEventHub",
                "properties": {
                  "dataConnectionId": "${CONNECTION_ID}",
                  "consumerGroupName": "fabric-eventstream-cg",
                  "inputSerialization": { "type": "Json", "properties": { "encoding": "UTF8" } }
                }
              }
            ],
            "destinations": [
              {
                "name": "db4ehab-dest",
                "type": "Eventhouse",
                "properties": {
                  "dataIngestionMode": "ProcessedIngestion",
                  "workspaceId": "${{ vars.FABRIC_WORKSPACE_ID }}",
                  "itemId": "${KQLDB_ID}",
                  "databaseName": "db4ehab",
                  "tableName": "${TABLE_NAME}",
                  "inputSerialization": { "type": "Json", "properties": { "encoding": "UTF8" } }
                },
                "inputNodes": [{ "name": "EH-source-stream" }]
              }
            ],
            "operators": [],
            "streams": [
              {
                "name": "EH-source-stream",
                "type": "DefaultStream",
                "properties": {},
                "inputNodes": [{ "name": "EH-source" }]
              }
            ],
            "compatibilityLevel": "1.0"
          }
          EOF
          cat eventstream.json | jq .

          PAYLOAD_B64=$(base64 -w0 eventstream.json)
          cat > update-request.json <<EOF
          {
            "definition": {
              "parts": [
                {
                  "path": "eventstream.json",
                  "payload": "${PAYLOAD_B64}",
                  "payloadType": "InlineBase64"
                }
              ]
            }
          }
          EOF

          HTTP_STATUS=$(curl -s -o update-response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $FABRIC_TOKEN" -H "Content-Type: application/json" \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ vars.FABRIC_WORKSPACE_ID }}/eventstreams/${EVENTSTREAM_ID}/updateDefinition" \
            -d @update-request.json)
          echo "HTTP status: $HTTP_STATUS"
          cat update-response.json | jq . || cat update-response.json
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::updateDefinition failed with status $HTTP_STATUS"
            exit 1
          fi
