name: demoehab

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'How long to stream events for (seconds)'
        default: '300'
      interval_seconds:
        description: 'Seconds between batches'
        default: '5'

permissions:
  contents: read

jobs:
  stream-energy-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r app_generator/requirements.txt

      - name: Run App_generator
        env:
          EVENTHUB_CONNECTION_STRING: ${{ secrets.GENERATOR_SOURCE_CONNECTION_STRING }}
          DURATION_SECONDS: ${{ github.event.inputs.duration_seconds || '300' }}
          INTERVAL_SECONDS: ${{ github.event.inputs.interval_seconds || '5' }}
          BATCH_SIZE: '10'
        run: python app_generator/generator.py
